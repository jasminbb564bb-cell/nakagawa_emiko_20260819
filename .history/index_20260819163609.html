<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Todo</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div class="app-shell">
    <section id="hero-intro" class="hero-intro hero-intro-standalone">
      <svg class="hero-intro-circle" viewBox="0 0 480 480" aria-hidden="true">
        <circle cx="240" cy="240" r="190"></circle>
      </svg>
      <div class="hero-intro-copy"></div>
    </section>

    <header class="top-date" id="top-date"></header>

    <main class="layout">
      <section id="main-view" class="main-view">
        <section class="hero" aria-labelledby="hero-heading">
          <div class="hero-head">
            <p class="eyebrow" id="hero-heading">&#20170;&#12289;&#12377;&#12427;&#12371;&#12392;</p>
            <button id="all-toggle" class="subtle-link" type="button">&#12377;&#12409;&#12390;&#35211;&#12427;</button>
          </div>
          <div id="focus-card" class="focus-card"></div>
          <div class="hero-foot">
            <button id="later-toggle" class="subtle-link" type="button"></button>
          </div>
        </section>

        <section class="panel input-panel" aria-labelledby="input-heading">
          <p class="eyebrow" id="input-heading">&#20837;&#21147;</p>
          <div id="input-guide" class="inline-guide"></div>
          <label class="sr-only" for="quick-input">Todo</label>
          <textarea id="quick-input" class="quiet-input" rows="4"
            placeholder="&#12473;&#12540;&#12497;&#12540; &#20170;&#26085; 18&#26178;"></textarea>
          <div class="input-actions">
            <button id="create-task" class="text-button" type="button">&#38928;&#12369;&#12427;</button>
            <p class="subtle-status" id="input-status"></p>
          </div>
        </section>

        <section class="panel choice-panel is-hidden" id="choice-panel" aria-labelledby="choice-heading">
          <p class="eyebrow" id="choice-heading">&#12393;&#12358;&#25201;&#12356;&#12414;&#12377;&#12363;</p>
          <div id="choice-card" class="choice-card"></div>
        </section>

        <section class="panel later-panel is-hidden" id="later-panel" aria-labelledby="later-heading">
          <p class="eyebrow" id="later-heading">&#12354;&#12392;&#12391;&#35211;&#12427;&#12418;&#12398;</p>
          <div id="later-list" class="later-list"></div>
        </section>
      </section>

      <section id="all-view" class="panel all-view is-hidden" aria-labelledby="all-heading">
        <div class="all-view-head">
          <p class="eyebrow" id="all-heading">&#12377;&#12409;&#12390;&#12398;&#20104;&#23450;</p>
          <button id="back-to-main" class="subtle-link" type="button">&#25147;&#12427;</button>
        </div>
        <div class="filter-row" id="filter-row">
          <button class="filter-chip is-active" data-filter="all" type="button">&#12377;&#12409;&#12390;</button>
          <button class="filter-chip" data-filter="now" type="button">&#20170;</button>
          <button class="filter-chip" data-filter="later" type="button">&#12354;&#12392;&#12391;</button>
          <button class="filter-chip" data-filter="completed" type="button">&#23436;&#20102;</button>
        </div>
        <div id="all-list" class="all-list"></div>
        <div class="developer-area">
          <button id="debug-toggle" class="subtle-link"
            type="button">&#20445;&#23384;&#12487;&#12540;&#12479;&#12434;&#30906;&#35469;</button>
          <pre id="debug-json" class="debug-json is-hidden"></pre>
        </div>
      </section>
    </main>
  </div>

  <template id="focus-template">
    <article class="task-card">
      <p class="task-kicker"></p>
      <div class="task-time"></div>
      <h1 class="task-title"></h1>
      <p class="task-copy"></p>
      <p class="inline-guide is-soft is-hidden"></p>
      <div class="task-actions"></div>
    </article>
  </template>

  <template id="choice-template">
    <article class="choice-item">
      <p class="task-kicker">&#26032;&#12375;&#12367;&#38928;&#12363;&#12387;&#12383;&#12371;&#12392;</p>
      <h2 class="choice-title"></h2>
      <p class="task-copy"></p>
      <div class="inline-guide is-soft is-hidden" id="choice-guide"></div>
      <div class="task-actions">
        <button class="text-button" data-choice="now" type="button">&#20170;</button>
        <button class="text-button" data-choice="later" type="button">&#12354;&#12392;&#12391;</button>
        <button class="text-button" data-choice="soon"
          type="button">1&#20998;&#24460;&#12395;&#20877;&#34920;&#31034;</button>
      </div>
    </article>
  </template>

  <template id="later-item-template">
    <article class="later-item">
      <div>
        <p class="task-kicker"></p>
        <h2 class="later-title"></h2>
        <p class="record-meta"></p>
      </div>
      <button class="text-button" data-action="show-now" type="button">&#20170;&#35211;&#12427;</button>
    </article>
  </template>

  <template id="all-item-template">
    <article class="all-item">
      <div class="all-item-main">
        <p class="task-kicker"></p>
        <h2 class="later-title"></h2>
        <p class="record-meta all-raw"></p>
        <p class="record-meta"></p>
      </div>
      <div class="all-item-actions">
        <button class="text-button danger-button" data-action="delete" type="button">&#21066;&#38500;</button>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>

</html>
