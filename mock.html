<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Todo Mock</title>
    <link rel="stylesheet" href="/mock.css" />
  </head>
  <body>
    <main class="mock-shell">
      <p class="mock-date">八月十九日　水曜日</p>

      <section class="mock-field" aria-label="予定一覧">
        <ol class="mock-schedule">
          <li class="mock-item">
            <span class="mock-day">2026.08.19</span>
            <span class="mock-time">10:00</span>
            <span class="mock-check" aria-hidden="true"></span>
            <span class="mock-title">企画書提出</span>
          </li>
          <li class="mock-item">
            <span class="mock-day"></span>
            <span class="mock-time">14:30</span>
            <span class="mock-check" aria-hidden="true"></span>
            <span class="mock-title">クライアント確認</span>
          </li>
          <li class="mock-item">
            <span class="mock-day"></span>
            <span class="mock-time">18:00</span>
            <span class="mock-check" aria-hidden="true"></span>
            <span class="mock-title">資料整理</span>
          </li>
          <li class="mock-item mock-item-soft">
            <span class="mock-day">2026.08.20</span>
            <span class="mock-time">09:15</span>
            <span class="mock-check" aria-hidden="true"></span>
            <span class="mock-title">静かな見直し</span>
          </li>
        </ol>
      </section>

      <aside class="mock-nav" aria-label="ナビゲーション">
        <nav class="mock-menu">
          <a href="#" class="is-current">今日</a>
          <a href="#">予定</a>
          <a href="#">タスク</a>
          <a href="#">記録</a>
          <a href="#">設定</a>
        </nav>
        <p class="mock-brand">quiet todo</p>
      </aside>

      <section class="mock-entry" aria-label="予定追加">
        <button id="mock-add" class="mock-plus" type="button" aria-expanded="false">＋</button>
        <form id="mock-form" class="mock-form is-hidden">
          <label class="sr-only" for="mock-input">予定入力</label>
          <input
            id="mock-input"
            class="mock-input"
            type="text"
            placeholder="買い物 今日 18時"
          />
        </form>
      </section>
    </main>

    <script src="/mock.js"></script>
  </body>
</html>
